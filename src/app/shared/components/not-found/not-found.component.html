<div class="not-found">
  <h1 class="not-found__code">404</h1>
  <h2 class="not-found__title">Page Not Found</h2>

  <p class="not-found__description">
    The page you are trying to access does not exist.
  </p>

  <button
    mat-raised-button
    color="primary"
    class="not-found__action"
    (click)="goHome()"
  >
    Go to Home
  </button>
</div>
