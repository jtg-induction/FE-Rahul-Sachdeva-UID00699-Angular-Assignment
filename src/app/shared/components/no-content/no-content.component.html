<div class="no-content">
  <h1 class="no-content__code">{{ code }}</h1>
  <h2 class="no-content__title">{{ title }}</h2>

  <p class="no-content__description">
    {{ message }}
  </p>

  <button
    mat-raised-button
    color="primary"
    class="no-content__action"
    (click)="navigate()"
  >
    {{ buttonText }}
  </button>
</div>
