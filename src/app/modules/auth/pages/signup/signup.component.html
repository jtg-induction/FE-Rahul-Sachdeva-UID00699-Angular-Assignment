<main class="signup-page">
  <aside class="signup-page__visual-section">
    <img
      class="signup-page__image"
      [src]="welcomeImage"
      alt="Welcome"
      loading="lazy"
      decoding="async"
    />
  </aside>

  <section class="signup-page__form-section">
    <mat-card class="signup-card">
      <mat-card-header class="signup-card__header">
        <mat-card-title class="signup-card__title">Signup</mat-card-title>
      </mat-card-header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="signup-card__form">
        <mat-form-field appearance="outline" class="signup-card__field">
          <mat-label>Username</mat-label>
          <input
            matInput
            type="text"
            formControlName="username"
            placeholder="Enter username"
            autocomplete="username"
          />
          <mat-icon matSuffix>person</mat-icon>

          <mat-error *ngIf="usernameError">
            {{ usernameError }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="signup-card__field">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Enter email"
            autocomplete="email"
          />
          <mat-icon matSuffix>email</mat-icon>

          <mat-error *ngIf="emailError">
            {{ emailError }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="signup-card__field">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter password"
            autocomplete="new-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hide = !hide"
            [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!hide"
          >
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>

          <mat-error *ngIf="passwordError">
            {{ passwordError }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="signup-card__field">
          <mat-label>Confirm Password</mat-label>
          <input
            matInput
            [type]="hide2 ? 'password' : 'text'"
            formControlName="confirmPassword"
            placeholder="Confirm Password"
            autocomplete="new-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hide2 = !hide2"
            [attr.aria-label]="hide2 ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!hide2"
          >
            <mat-icon>{{ hide2 ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>

          <mat-error *ngIf="confirmPasswordError">
            {{ confirmPasswordError }}
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || loading"
          class="signup-card__button"
        >
          SUBMIT
        </button>

        <a
          class="signup-card__link"
          [routerLink]="['/', routes.AUTH.BASE, routes.AUTH.LOGIN]"
        >
          Already have an Account? Login.
        </a>
      </form>
    </mat-card>
  </section>
</main>
