<div class="login-page">
  <section class="login-page__form-section">
    <mat-card class="login-card">
      <mat-card-header class="login-card__header">
        <mat-card-title class="login-card__title">Login</mat-card-title>
      </mat-card-header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-card__form">
        <mat-form-field appearance="outline" class="login-card__field">
          <mat-label>Username</mat-label>
          <input
            matInput
            type="text"
            formControlName="username"
            placeholder="Enter username"
          />
          <mat-icon matSuffix>person</mat-icon>

          <mat-error *ngIf="username?.touched && username?.errors">
            <span *ngIf="username?.hasError('required')"> Required </span>
            <span *ngIf="username?.hasError('minlength')">
              Min {{ username?.getError('minlength')?.requiredLength }} chars
            </span>
            <span *ngIf="username?.hasError('alphaNumeric')">
              Alphanumeric only
            </span>
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="login-card__field">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter password"
          />
          <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
       
          <mat-error *ngIf="password?.touched && password?.errors">
            <span *ngIf="password?.hasError('required')"> Required </span>
            <span *ngIf="password?.hasError('pattern')">
              min 8 chars, 2 numbers & 2 special chars
            </span>
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || loading"
          class="login-card__button"
        >
          <ng-container *ngIf="!loading">SUBMIT</ng-container>
          <ng-container *ngIf="loading">
            <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
          </ng-container>
        </button>

        <a class="login-card__link" routerLink="/auth/signup">
          Don't have an Account? Sign Up.
        </a>
      </form>
    </mat-card>
  </section>

  <aside class="login-page__visual-section">
    <img
      class="login-page__image"
      src="assets/images/welcome-back.png"
      alt="Welcome Back"
    />
  </aside>
</div>
