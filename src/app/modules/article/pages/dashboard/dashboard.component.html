<main class="dashboard">
  <section *ngIf="!isLoading && articles.length === 0">
    <app-no-content
      title="No Articles Found"
      message="No articles available for this page."
      buttonText="Go Home"
      redirectTo="/"
    ></app-no-content>
  </section>

  <section
    class="dashboard__grid"
    *ngIf="!isLoading && articles.length > 0"
    aria-label="Articles List"
  >
    <app-article-card
      *ngFor="let article of articles"
      [article]="article"
    ></app-article-card>
  </section>

  <section
    class="dashboard__paginator"
    *ngIf="!isLoading && articles.length > 0"
  >
    <mat-paginator
      [length]="pagination.totalItems"
      [pageSize]="pagination.pageSize"
      [pageIndex]="pagination.pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </section>
</main>
